  .btn:active{opacity:0.85;}
  .btn.secondary{background:var(--pitch-dim);color:var(--pitch);}
  .btn.ghost{background:none;color:var(--ink-dim);border:1px solid var(--line);}
  .btn.danger{background:var(--red-bg);color:var(--red);}
  .btn.small{padding:7px 10px;font-size:12.5px;width:auto;}

  .empty{
    text-align:center;padding:40px 20px;color:var(--ink-dim);
  }
  .empty .ico{font-size:34px;display:block;margin-bottom:10px;}

  .chip{
    display:inline-block;padding:3px 9px;border-radius:99px;
    font-size:11px;font-weight:600;
  }
  .chip.live{background:var(--red-bg);color:var(--red);}
  .chip.scheduled{background:var(--pitch-dim);color:var(--pitch);}

  .team-select{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
  .team-pill{
    flex:none;padding:8px 16px;border-radius:99px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .team-pill.active{background:var(--pitch);border-color:var(--pitch);color:#fff;}

  .player-row{
    display:flex;align-items:center;gap:10px;
    padding:11px 4px;border-bottom:1px solid var(--line);
  }
  .player-row:last-child{border-bottom:none;}
  .player-num{
    width:30px;height:30px;border-radius:8px;background:var(--pitch-dim);color:var(--pitch);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;
  }
  .player-name{flex:1;font-size:14.5px;font-weight:600;}
  .player-pos{font-size:11.5px;color:var(--ink-dim);}

  .match-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;
    background:var(--surface);cursor:pointer;
  }
  .match-item .opp{font-weight:700;font-size:15px;}
  .match-item .date{font-size:12.5px;color:var(--ink-dim);margin-top:2px;}

  /* live view — pantalla completa */
  .live-full{
    position:fixed;inset:0;z-index:30;background:var(--bg);
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  .live-topbar{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    border-bottom:1px solid var(--line);flex:none;
  }
  .live-topbar .back{background:none;border:none;font-size:20px;color:var(--ink-dim);cursor:pointer;padding:2px 4px;}
  .live-topbar .meta{flex:1;min-width:0;}
  .live-topbar .meta .opp{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .live-topbar .meta .date{font-size:11px;color:var(--ink-dim);}

function tokenHtml(p, minMs, ev, isOn, canEdit){
  const mins = Math.floor(Math.max(0,minMs)/60000);
  const badge = ev.red ? '🟥' : (ev.yellow ? '🟨' : '');
  const tap = canEdit ? `onclick="handleToggleField('${p.id}',${isOn})"` : '';
  return `<div class="ptoken ${isOn?'':'bench'}" ${tap}>
    <div class="pcircle">
      ${esc(shortName(p.name))}
      ${badge?`<span class="pbadge">${badge}</span>`:''}
      ${ev.goal?`<span class="pbadge-goal">⚽${ev.goal}</span>`:''}
    </div>
    <div class="pmins">${mins}'</div>
  </div>`;
}

function handleStart(){ startOrResumeClock(State.liveMatch); }
function handlePause(){ pauseClock(State.liveMatch); }
function handleEnd(){
  if(!confirm('¿Finalizar el partido? Se cerrará el tiempo de todos los jugadores en cancha.')) return;
  const players = State.playersByTeam[State.liveMatch.teamId] || [];
  const elapsed = matchElapsedMs(State.liveMatch);
  const {onField} = deriveFieldState(State.liveLog, players, elapsed);
  endMatch(State.liveMatch, [...onField]);
}
function handleToggleField(playerId, isOn){ toggleFieldPlayer(State.liveMatch, playerId, isOn); }

function handleAddGoalClick(){
  const players = State.playersByTeam[State.liveMatch.teamId] || [];
  if(players.length===0){ toast('Añade jugadores primero'); return; }
  openPicker('¿Quién marca?', players, (scorerId)=>{
    if(!scorerId) return;
    const rest = players.filter(p=>p.id!==scorerId);
    openPicker('¿Asistencia?', rest, (assistId)=>{
      addGoal(State.liveMatch, scorerId, assistId);
    }, 'Sin asistencia');
  });
}
function handleRemoveGoalClick(){
  if(!confirm('¿Quitar el último gol registrado?')) return;
  removeLastGoal();
}
function handleAddCardClick(type){
  const players = State.playersByTeam[State.liveMatch.teamId] || [];
  if(players.length===0){ toast('Añade jugadores primero'); return; }
  const title = type==='yellow' ? '¿A quién se amonesta?' : '¿A quién se expulsa?';
  openPicker(title, players, (pid)=>{ if(pid) logEvent(State.liveMatch, pid, type); });
}
function handleRemoveCardClick(type){
  const label = type==='yellow' ? 'amarilla' : 'roja';
  if(!confirm(`¿Quitar la última tarjeta ${label}?`)) return;
  removeLastCard(type);
}
function handleRivalScoreClick(delta){ setRivalScore(State.liveMatch, delta); }

/* ----- Estadísticas ----- */
let statsCache = {}; // teamId -> {totals, matchesPlayedCount}
let statsLoading = false;
function renderStats(app){
  if(State.teams.length===0){
    app.innerHTML = `<div class="empty"><span class="ico">👥</span>Primero crea un equipo.</div>`;
    return;
  }
  if(!State.statsTeamId) State.statsTeamId = State.teams[0].id;
  let html = `<div class="team-select">` + State.teams.map(t=>
    `<button class="team-pill ${State.statsTeamId===t.id?'active':''}" onclick="selectStatsTeam('${t.id}')">${esc(t.name)}</button>`
  ).join('') + `</div>`;

  const cached = statsCache[State.statsTeamId];
  html += `<div class="card">`;
  if(statsLoading && !cached){
    html += `<div class="empty" style="padding:16px;">Calculando estadísticas…</div>`;
  } else if(cached){
    html += `<h2>Temporada · ${cached.matchesPlayedCount} partido(s) finalizado(s)</h2>`;
    const rows = cached.totals.filter(r=>r.player).sort((a,b)=> b.minutes - a.minutes);
    if(rows.length===0){
      html += `<div class="empty" style="padding:16px;">Aún no hay partidos finalizados con datos.</div>`;
    } else {
      html += `<div style="overflow-x:auto;"><table class="stats"><thead><tr>
        <th>Jugador</th><th class="c">PJ</th><th class="c">Min</th><th class="c">⚽</th><th class="c">🅰️</th><th class="c">🟨</th><th class="c">🟥</th>
      </tr></thead><tbody>` +
      rows.map(r=>`<tr>
        <td><div class="pname">${esc(r.player.name)}</div><div class="pnum">${r.player.number?'#'+r.player.number:''} ${esc(r.player.position||'')}</div></td>
        <td class="c">${r.matches}</td>
        <td class="c">${r.minutes>0?Math.floor(r.minutes/60000):0}'</td>
        <td class="c">${r.goal}</td>
        <td class="c">${r.assist}</td>
        <td class="c">${r.yellow}</td>
        <td class="c">${r.red}</td>
      </tr>`).join('') + `</tbody></table></div>`;
    }
    html += `<button class="btn ghost" style="margin-top:14px;" onclick="refreshStats(true)">Actualizar</button>`;
  } else {
    html += `<div class="empty" style="padding:16px;">Sin datos aún</div>`;
  }
  html += `</div>`;
  app.innerHTML = html;
  if(!cached && !statsLoading) refreshStats(false);
}
function selectStatsTeam(teamId){ State.statsTeamId = teamId; renderDynamic(); }
async function refreshStats(force){
  const teamId = State.statsTeamId;
  if(!teamId) return;
  if(force) delete statsCache[teamId];
  statsLoading = true;
  try{
    const result = await loadSeasonStats(teamId);
    statsCache[teamId] = result;
  }catch(e){ console.error(e); }
  statsLoading = false;
  if(State.view==='stats') renderDynamic();
}

/* invalidar caché de stats cuando cambian los partidos */
const _origRenderDynamic = renderDynamic;

initDb();
