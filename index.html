            <button className="btn btn-primary btn-block" onClick={goToNewMatchSetup}>+ Nuevo partido</button>
            <div className="format-header">📅 Próximos Fútbol 11 ({allUpcomingF11.length})</div>
            <div className="card">{allUpcomingF11.length === 0 && <div className="empty-note">Sin partidos programados de F11.</div>}{allUpcomingF11.slice().sort(function(a, b) { return (a.date + a.hour).localeCompare(b.date + b.hour); }).map(function(rec) { return <div className="history-card upcoming-card" key={rec.id}><div className="history-info" onClick={function() { editUpcoming(rec); }}><div className="upcoming-badge">PROGRAMADO</div><div className="history-rival">{rec.teamName ? rec.teamName + " " : ""}vs {rec.rival}</div><div className="history-meta">{formatDateDisplay(rec.date)} · {rec.hour} · {rec.venue === "local" ? "Local" : "Visitante"}</div></div><button className="btn btn-primary btn-small" onClick={function() { openUpcoming(rec); }}>Empezar</button><button className="row-remove" onClick={function() { removeUpcoming(rec); }}>×</button></div>; })}</div>
            <div className="format-header">📅 Próximos Fútbol 7 ({allUpcomingF7.length})</div>
            <div className="card">{allUpcomingF7.length === 0 && <div className="empty-note">Sin partidos programados de F7.</div>}{allUpcomingF7.slice().sort(function(a, b) { return (a.date + a.hour).localeCompare(b.date + b.hour); }).map(function(rec) { return <div className="history-card upcoming-card" key={rec.id}><div className="history-info" onClick={function() { editUpcoming(rec); }}><div className="upcoming-badge">PROGRAMADO</div><div className="history-rival">{rec.teamName ? rec.teamName + " " : ""}vs {rec.rival}</div><div className="history-meta">{formatDateDisplay(rec.date)} · {rec.hour} · {rec.venue === "local" ? "Local" : "Visitante"}</div></div><button className="btn btn-primary btn-small" onClick={function() { openUpcoming(rec); }}>Empezar</button><button className="row-remove" onClick={function() { removeUpcoming(rec); }}>×</button></div>; })}</div>
            <div className="format-header">⚽ Historial Fútbol 11 ({allHistoryF11.length})</div>
            <div className="card">{allHistoryF11.length === 0 && <div className="empty-note">Sin partidos de F11.</div>}{allHistoryF11.map(function(rec) { return <div className="history-card" key={rec.id}><div className="history-info" onClick={function() { setDetailRecord(rec); }}><div className="history-rival">{rec.teamName ? rec.teamName + " " : ""}vs {rec.rival}</div><div className="history-meta">{formatDateDisplay(rec.date)} · {rec.hour}</div></div><div className="history-score">{rec.home}–{rec.away}</div><button className="row-remove" onClick={function(e) { e.stopPropagation(); removeHistoryRecord(rec); }}>×</button></div>; })}</div>
            <div className="format-header">⚽ Historial Fútbol 7 ({allHistoryF7.length})</div>
            <div className="card">{allHistoryF7.length === 0 && <div className="empty-note">Sin partidos de F7.</div>}{allHistoryF7.map(function(rec) { return <div className="history-card" key={rec.id}><div className="history-info" onClick={function() { setDetailRecord(rec); }}><div className="history-rival">{rec.teamName ? rec.teamName + " " : ""}vs {rec.rival}</div><div className="history-meta">{formatDateDisplay(rec.date)} · {rec.hour}</div></div><div className="history-score">{rec.home}–{rec.away}</div><button className="row-remove" onClick={function(e) { e.stopPropagation(); removeHistoryRecord(rec); }}>×</button></div>; })}</div>
          </div>}
          {activeTab === "partidos" && matchPhase === "setup" && setupStep === "info" && <div className="content">
            <div className="card"><h2>{editingUpcomingId ? "Editar partido" : "Nuevo partido"}</h2><p className="card-hint">Equipo: <b style={{ color: "var(--accent)" }}>{teamName}</b> ({format.label})</p><label className="field-label">Rival</label><input className="input" value={rivalName} onChange={function(e) { setRivalName(e.target.value); }} placeholder="Nombre rival" /><label className="field-label" style={{ marginTop: 14 }}>Sede</label><div className="formation-grid"><div className={"formation-chip" + (venue === "local" ? " active" : "")} onClick={function() { setVenue("local"); }}>Local</div><div className={"formation-chip" + (venue === "visitante" ? " active" : "")} onClick={function() { setVenue("visitante"); }}>Visitante</div></div><label className="field-label" style={{ marginTop: 14 }}>Fecha y hora</label><div className="row-inputs"><input className="input" type="date" value={matchDate} onChange={function(e) { setMatchDate(e.target.value); }} /><input className="input" type="time" value={matchHour} onChange={function(e) { setMatchHour(e.target.value); }} /></div><label className="field-label" style={{ marginTop: 14 }}>Formación</label><div className="formation-grid">{Object.keys(format.formations).map(function(key) { return <div key={key} className={"formation-chip" + (key === formationKey ? " active" : "")} onClick={function() { setFormationKey(key); setLineup({}); }}>{key}</div>; })}<div className={"formation-chip" + (formationKey === "CUSTOM" ? " active" : "")} onClick={function() { setFormationKey("CUSTOM"); setLineup({}); }}>Personalizada</div></div></div>
            <div className="card"><h2>Jugadores disponibles ({availablePlayerIds.length}/{players.length})</h2><p className="card-hint">Marca quién puede jugar. Usa ❗ para indicar motivo de ausencia.</p><div className="list">{players.map(function(p) { var isAvail = availablePlayerIds.includes(p.id); var abs = absences[p.id]; return <div key={p.id} className={"list-row" + (isAvail && !abs ? " list-row-selected" : "") + (abs ? " list-row-absence" : "")}><div className="row-name" onClick={function() { toggleAvailable(p.id); }}>{p.name}{abs && <span className="mini-tag absence">{ABSENCE_LABELS[abs]}</span>}</div><button className={"absence-btn" + (abs ? " has-absence" : "")} onClick={function(e) { e.stopPropagation(); setAbsenceModal(p.id); }}>❗</button><div className="checkbox" onClick={function() { toggleAvailable(p.id); }}>{isAvail ? "✓" : ""}</div></div>; })}</div></div>
            <div className="actions-row"><button className="btn btn-ghost" onClick={function() { setEditingUpcomingId(null); setMatchPhase("list"); }}>Cancelar</button><button className="btn btn-primary" disabled={!canContinueToLineup} onClick={function() { setSetupStep("lineup"); }}>Alineación</button></div>
          </div>}
          {activeTab === "partidos" && matchPhase === "setup" && setupStep === "lineup" && <div className="content">
            <div className="selection-hint">Toca una ficha y luego otra para <b>intercambiar posiciones</b>. O toca una ficha y un jugador del banquillo para el cambio. <b>{filledSlots}/{formation.slots.length}</b></div>
            <div className="pitch-wrap"><Pitch formation={formation} slots={formation.slots} lineup={lineup} players={enrichedPlayers} selected={selected} onSlotTap={handleSlotTap} statusFor={statusFor} cardsFor={cardsOf} onPitchTap={addCustomSlot} onSlotDrag={handleSlotDrag} draggable={true} /></div>
            <div className="card"><h2>Sin asignar ({benchPlayers.length})</h2><div className="list">{benchPlayers.length === 0 && <div className="empty-note">Todos los disponibles están en el campo.</div>}{benchPlayers.slice().sort(function(a, b) { return Number(a.number) - Number(b.number); }).map(function(p) { return <PlayerRow key={p.id} player={p} onTap={function() { handlePlayerTap(p.id); }} selected={selected && selected.type === "player" && selected.id === p.id} showTime={false} />; })}</div></div>
            <div className="actions-row"><button className="btn btn-ghost" onClick={function() { setSetupStep("info"); }}>Volver</button><button className="btn btn-ghost" onClick={scheduleMatch}>{editingUpcomingId ? "Guardar" : "Programar"}</button>{!editingUpcomingId && <button className="btn btn-primary" disabled={!canStartMatch} onClick={startMatch}>Empezar</button>}</div>
          </div>}
          {activeTab === "partidos" && matchPhase === "summary" && <div className="content">
            <div className="card"><h2>Resumen</h2><div className="score-result">{teamName || "Nosotros"} {totalHomeAllParts} – {totalAwayAllParts} {rivalName || "Rival"}</div><p className="card-hint">{formatDateDisplay(matchDate)} · {matchHour} · Duración: {formatTime(partScores.reduce(function(a, p) { return a + p.seconds; }, 0))}</p>{partScores.length > 0 && <div style={{ marginBottom: 12 }}><h3 style={{ fontSize: 13, marginBottom: 6, color: "var(--ink-soft)" }}>Por partes</h3>{partScores.map(function(ps) { return <div key={ps.part} style={{ fontSize: 13, padding: "4px 0" }}>{partLabel(ps.part, numParts)}: {teamName} {ps.home} – {ps.away} {rivalName} · {formatTime(ps.seconds)}</div>; })}</div>}{events.length > 0 && <div style={{ marginBottom: 12 }}><h3 style={{ fontSize: 13, marginBottom: 6, color: "var(--ink-soft)" }}>Goles</h3>{events.map(function(ev) { return <div key={ev.id} style={{ fontSize: 13, padding: "6px 0", borderBottom: "1px solid var(--line)" }}>⚽ {partLabel(ev.part || 1, numParts)} {formatTime(ev.time)} · <b>{ev.scorerName}</b>{ev.assistName ? <span> (asist. {ev.assistName})</span> : null}</div>; })}</div>}<table className="summary-table"><thead><tr><th>Jugador</th><th>Min</th><th>🟨</th><th>🟥</th></tr></thead><tbody>{enrichedPlayers.filter(function(p) { return availablePlayerIds.includes(p.id); }).slice().sort(function(a, b) { return b.seconds - a.seconds; }).map(function(p) { return <tr key={p.id}><td>{p.name}</td><td className="t-num">{formatTime(p.seconds)}</td><td className="t-num">{p.cards.yellow || ""}</td><td className="t-num">{p.cards.red || ""}</td></tr>; })}</tbody></table></div>
            <div className="actions-row"><button className="btn btn-ghost" onClick={function() { setMatchPhase("list"); }}>Ver partidos</button><button className="btn btn-primary" onClick={goToNewMatchSetup}>Nuevo partido</button></div>
          </div>}
          {activeTab === "estadisticas" && <div className="content">
            <p className="card-hint">Estadísticas del equipo <b>{teamName}</b></p>
            <div className="subtabbar">
              <button className={"subtab-btn" + (statsTab === "partido" ? " active" : "")} onClick={function() { setStatsTab("partido"); }}>📋 Por partido</button>
              <button className={"subtab-btn" + (statsTab === "totales" ? " active" : "")} onClick={function() { setStatsTab("totales"); }}>📊 Totales</button>
            </div>
            {statsTab === "partido" && <div>
              {statsHistoryAll.length === 0 && <div className="card"><div className="empty-note">Todavía no hay partidos jugados.</div></div>}
              {statsHistoryAll.length > 0 && <>
                <div className="formation-grid" style={{ marginBottom: 6 }}>
                  <div className={"formation-chip" + (histTeamFilter === "all" ? " active" : "")} onClick={function() { setHistTeamFilter("all"); }}>Todos</div>
                  {teams.map(function(t) { return <div key={t.id} className={"formation-chip" + (histTeamFilter === t.id ? " active" : "")} onClick={function() { setHistTeamFilter(t.id); }}>{t.name || "Sin nombre"}</div>; })}
                </div>
                <div className="card" style={{ padding: 12 }}>
                  {statsHistoryFiltered.length === 0 && <div className="empty-note">Sin partidos para este filtro.</div>}
                  {statsHistoryFiltered.map(function(rec) {
                    var teamBadge = rec.teamName || "Equipo";
                    var badgeColor = (rec.teamFormat || "f11") === "f7" ? "#4A7FB5" : "#3FA65A";
                    return (<div className="history-card" key={rec.id} onClick={function() { setDetailRecord(rec); }}>
                      <div className="history-info">
                        <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 4 }}>
                          <span style={{ background: badgeColor + "22", color: badgeColor, padding: "2px 7px", borderRadius: 6, fontSize: 10, fontWeight: 700 }}>{teamBadge} · {FORMATS[rec.teamFormat || "f11"].label}</span>
                        </div>
                        <div className="history-rival">vs {rec.rival}</div>
                        <div className="history-meta">{formatDateDisplay(rec.date)} · {rec.hour} · {rec.venue === "local" ? "Local" : "Visitante"}</div>
                      </div>
                      <div className="history-score">{rec.home}–{rec.away}</div>
                    </div>);
                  })}
                </div>
              </>}
            </div>}
            {statsTab === "totales" && <div>
              <div className="format-header">⚽ Fútbol 11</div>
              <div className="stat-summary"><div className="stat-box"><div className="num">{f11HistoryCurrent.length}</div><div className="lbl">Partidos</div></div><div className="stat-box"><div className="num">{f11HistoryCurrent.reduce(function(a, r) { return a + r.home; }, 0)}</div><div className="lbl">Goles a favor</div></div><div className="stat-box"><div className="num">{f11HistoryCurrent.reduce(function(a, r) { return a + r.away; }, 0)}</div><div className="lbl">En contra</div></div></div>
              <div className="card"><h2>Totales acumulados · {teamName}</h2>{aggF11.length === 0 && <div className="empty-note">Sin datos.</div>}{aggF11.length > 0 && <table className="summary-table"><thead><tr><th>Jugador</th><th>PJ</th><th>Total</th><th>⚽</th><th>🅰️</th><th>🟨</th><th>🟥</th></tr></thead><tbody>{aggF11.slice().sort(function(a, b) { return b.seconds - a.seconds; }).map(function(p) { return <tr key={p.id}><td>{p.name}</td><td className="t-num">{p.matches}</td><td className="t-num">{formatTime(p.seconds)}</td><td className="t-num">{p.goals || ""}</td><td className="t-num">{p.assists || ""}</td><td className="t-num">{p.yellow || ""}</td><td className="t-num">{p.red || ""}</td></tr>; })}</tbody></table>}</div>
              <div className="format-header">⚽ Fútbol 7</div>
              <div className="stat-summary"><div className="stat-box"><div className="num">{f7HistoryCurrent.length}</div><div className="lbl">Partidos</div></div><div className="stat-box"><div className="num">{f7HistoryCurrent.reduce(function(a, r) { return a + r.home; }, 0)}</div><div className="lbl">Goles a favor</div></div><div className="stat-box"><div className="num">{f7HistoryCurrent.reduce(function(a, r) { return a + r.away; }, 0)}</div><div className="lbl">En contra</div></div></div>
              <div className="card"><h2>Totales acumulados · {teamName}</h2>{aggF7.length === 0 && <div className="empty-note">Sin datos.</div>}{aggF7.length > 0 && <table className="summary-table"><thead><tr><th>Jugador</th><th>PJ</th><th>Total</th><th>⚽</th><th>🅰️</th><th>🟨</th><th>🟥</th></tr></thead><tbody>{aggF7.slice().sort(function(a, b) { return b.seconds - a.seconds; }).map(function(p) { return <tr key={p.id}><td>{p.name}</td><td className="t-num">{p.matches}</td><td className="t-num">{formatTime(p.seconds)}</td><td className="t-num">{p.goals || ""}</td><td className="t-num">{p.assists || ""}</td><td className="t-num">{p.yellow || ""}</td><td className="t-num">{p.red || ""}</td></tr>; })}</tbody></table>}</div>
            </div>}
          </div>}
        </>)}
      </div>
      {matchPhase === "live" && activeTab !== "partidos" && <div className="live-banner" onClick={function() { setActiveTab("partidos"); }}>● {rivalName ? "vs " + rivalName : "Partido"} en curso · parte {part} · toca para volver</div>}
      {absenceModal && <div className="modal-backdrop" onClick={function() { setAbsenceModal(null); }}><div className="modal-sheet" onClick={function(e) { e.stopPropagation(); }}><div className="modal-header"><h2 style={{ margin: 0 }}>Motivo de ausencia</h2><button className="modal-close" onClick={function() { setAbsenceModal(null); }}>×</button></div><p className="card-hint">Selecciona el motivo.</p><div className={"absence-option" + (!absences[absenceModal] ? " selected" : "")} onClick={function() { var n = Object.assign({}, absences); delete n[absenceModal]; setAbsences(n); setAvailablePlayerIds(function(prev) { return prev.includes(absenceModal) ? prev : prev.concat([absenceModal]); }); setAbsenceModal(null); }}><span>✅</span> Convocado</div>{Object.entries(ABSENCE_LABELS).map(function(entry) { var key = entry[0]; var label = entry[1]; return <div key={key} className={"absence-option" + (absences[absenceModal] === key ? " selected" : "")} onClick={function() { setAbsences(function(prev) { var n = Object.assign({}, prev); n[absenceModal] = key; return n; }); setAvailablePlayerIds(function(prev) { return prev.filter(function(x) { return x !== absenceModal; }); }); setLineup(function(prev) { var n = Object.assign({}, prev); Object.keys(n).forEach(function(k) { if (n[k] === absenceModal) delete n[k]; }); return n; }); setAbsenceModal(null); }}><span>{label.split(" ")[0]}</span> {label.replace(/^\S+\s/, "")}</div>; })}</div></div>}
      {newTeamOpen && <NewTeamModal onCreate={function(name, fmt) { createTeam(name, fmt); setNewTeamOpen(false); setTeamDetailOpen(true); }} onCancel={function() { setNewTeamOpen(false); }} />}
      {addPlayerOpen && <AddPlayerModal onAdd={addPlayer} onCancel={function() { setAddPlayerOpen(false); }} />}
      {editingPlayer && <AddPlayerModal existing={editingPlayer} onAdd={function(data) { updatePlayer(editingPlayer.id, data); }} onCancel={function() { setEditPlayerId(null); }} />}
      {matchTeamSelectorOpen && <MatchTeamSelector teams={teams} onSelect={onSelectMatchTeam} onCancel={function() { setMatchTeamSelectorOpen(false); }} />}
      {detailRecord && <MatchDetailModal record={detailRecord} onClose={function() { setDetailRecord(null); }} />}
      <div className="tabbar">{tabs.map(function(t) { var Icon = t.icon; return <button key={t.id} className={"tab-btn" + (activeTab === t.id ? " tab-active" : "")} onClick={function() { setActiveTab(t.id); if (t.id === "jugadores") setTeamDetailOpen(false); }}>{matchPhase === "live" && t.id === "partidos" && activeTab !== "partidos" && <span className="tab-live-dot" />}<Icon active={activeTab === t.id} /><span>{t.label}</span></button>; })}</div>
    </div>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
