  <script>
    const ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="96" fill="#0B2416"/>
      <circle cx="240" cy="272" r="160" stroke="#ECF3EE" stroke-width="30" fill="none"/>
      <path d="M240 160l58 42-22 68h-72l-22-68z" fill="#ECF3EE"/>
      <path d="M240 96v-42M192 54h96" stroke="#ECF3EE" stroke-width="30" stroke-linecap="round"/>
      <circle cx="240" cy="272" r="26" fill="#0B2416"/>
    </svg>`;

    function svgToPngDataURL(svg, size) {
      return new Promise((resolve) => {
        const blob = new Blob([svg], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          const c = document.createElement("canvas");
          c.width = size; c.height = size;
          const ctx = c.getContext("2d");
          ctx.drawImage(img, 0, 0, size, size);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL("image/png"));
        };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(""); };
        img.src = url;
      });
    }

    (async () => {
      const png180 = await svgToPngDataURL(ICON_SVG, 180);
      const png192 = await svgToPngDataURL(ICON_SVG, 192);
      const png512 = await svgToPngDataURL(ICON_SVG, 512);

      document.getElementById("apple-icon").href = png180;
      document.getElementById("favicon").href = png192;

      const manifest = {
        name: "Mi equipo · Control de minutos",
        short_name: "Mi equipo",
        description: "Control de tiempo de juego y tarjetas para fútbol 11",
        start_url: ".",
        scope: ".",
        display: "standalone",
        orientation: "portrait",
        background_color: "#0D1310",
        theme_color: "#0D1310",
        icons: [
          { src: png192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
          { src: png512, sizes: "512x512", type: "image/png", purpose: "any maskable" },
        ],
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      document.getElementById("manifest-link").href = URL.createObjectURL(manifestBlob);

      if ("serviceWorker" in navigator && location.protocol === "https:") {
        const swCode = `
          const CACHE = "mi-equipo-v1";
          self.addEventListener("install", (e) => { self.skipWaiting(); });
          self.addEventListener("activate", (e) => { e.waitUntil(self.clients.claim()); });
          self.addEventListener("fetch", (e) => {
            const req = e.request;
            if (req.method !== "GET") return;
            if (req.mode === "navigate") {
              e.respondWith(fetch(req).catch(() => caches.match(req)));
              return;
            }
            e.respondWith(
              caches.match(req).then((cached) => {
                const f = fetch(req).then((res) => {
                  if (res && res.status === 200 && res.type === "basic") {
                    const copy = res.clone();
                    caches.open(CACHE).then((c) => c.put(req, copy));
                  }
                  return res;
                }).catch(() => cached);
                return cached || f;
              })
            );
          });
        `;
        const swBlob = new Blob([swCode], { type: "application/javascript" });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      }
    })();

    const PREFIX = "app:";
    window.storage = {
      async get(key) {
        try { const raw = localStorage.getItem(PREFIX + key); return raw ? { value: raw } : null; }
        catch (e) { return null; }
      },
      async set(key, value) {
        try { localStorage.setItem(PREFIX + key, value); return true; }
        catch (e) { return false; }
      },
      async remove(key) { try { localStorage.removeItem(PREFIX + key); } catch (e) {} },
    };
  </script>

  const ROSTER_KEY = "equipo-plantilla";
  const HISTORY_KEY = "equipo-historial";

  function formatTime(totalSeconds) {
    const s = Math.max(0, Math.floor(totalSeconds));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${String(sec).padStart(2, "0")}`;
  }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function nowHHMM() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }
  function formatDateDisplay(iso) {
    try {
      return new Date(iso + "T00:00:00").toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
    } catch (e) { return iso; }
  }

  function MarkIcon() {
    return (
      <svg width="28" height="28" viewBox="0 0 30 30" fill="none">
        <circle cx="14" cy="16" r="10" stroke="#ECF3EE" strokeWidth="2" />
        <path d="M14 9.5l3.6 2.6-1.4 4.2h-4.4l-1.4-4.2z" fill="#ECF3EE" />

  }

  }
  function IconMatch({ active }) {
    const c = active ? "var(--accent)" : "var(--ink-soft)";

  function Pitch({ formation, lineup, players, selected, onSlotTap, statusFor, cardsFor }) {
    const byId = Object.fromEntries(players.map((p) => [p.id, p]));
    return (
      <svg viewBox="0 0 300 420" className="pitch-svg" role="img" aria-label="Campo de fútbol">
        {[0, 1, 2, 3, 4, 5].map((i) => (
          <rect key={i} x="4" y={4 + i * (412 / 6)} width="292" height={412 / 6}
            className={i % 2 === 0 ? "pitch-grass-a" : "pitch-grass-b"} />
        ))}
        <rect x="4" y="4" width="292" height="412" rx="6" fill="none" className="pitch-line" strokeWidth="2" />
        <line x1="4" y1="210" x2="296" y2="210" className="pitch-line" strokeWidth="2" />
        <circle cx="150" cy="210" r="34" fill="none" className="pitch-line" strokeWidth="2" />
        <circle cx="150" cy="210" r="2" className="pitch-line-fill" />
        <rect x="80" y="4" width="140" height="66" fill="none" className="pitch-line" strokeWidth="2" />
        <rect x="118" y="4" width="64" height="26" fill="none" className="pitch-line" strokeWidth="2" />
        <rect x="80" y="350" width="140" height="66" fill="none" className="pitch-line" strokeWidth="2" />
        <rect x="118" y="390" width="64" height="26" fill="none" className="pitch-line" strokeWidth="2" />
        <rect x="128" y="0" width="44" height="4" className="pitch-line-fill" />
        <rect x="128" y="416" width="44" height="4" className="pitch-line-fill" />
        {formation.slots.map((slot) => {
          const playerId = lineup[slot.id];
          const player = playerId ? byId[playerId] : null;
          const isSelected = selected && selected.type === "slot" && selected.id === slot.id;
          const status = player ? statusFor(player.id) : null;
          const cards = player ? cardsFor(player.id) : null;
          return (
            <g key={slot.id} transform={`translate(${slot.x} ${slot.y})`} className="token-group" onClick={() => onSlotTap(slot.id)}>
              <circle r={isSelected ? 24 : 21}
                className={"token-circle " + (player ? "token-filled" : "token-empty") +
                  (isSelected ? " token-selected" : "") +
                  (status === "coral" ? " token-coral" : "") +
                  (status === "amber" ? " token-amber" : "")} />
              {player ? (
                <text textAnchor="middle" dy="5" className="token-number">{player.number}</text>
              ) : (
                <text textAnchor="middle" dy="4" className="token-pos">{slot.pos}</text>
              )}
              {cards && cards.red > 0 && <circle cx="15" cy="-15" r="5" className="dot-red" />}
              {cards && cards.red === 0 && cards.yellow > 0 && <circle cx="15" cy="-15" r="5" className="dot-yellow" />}
              {player && (
                <g transform="translate(0 30)">
                  <rect x="-19" y="-8" width="38" height="15" rx="7.5" className="chip-bg" />
                  <text textAnchor="middle" dy="3" className="chip-text">{formatTime(player.seconds)}</text>
                </g>
              )}
            </g>
          );
        })}
      </svg>
    );
  }

  function PlayerRow({ player, onTap, selected, showTime, status, extraRight, cards }) {
    return (
      <div className={"list-row" + (selected ? " list-row-selected" : "")} onClick={onTap}>
        <div className="row-number">{player.number}</div>
        <div className="row-name">
          {player.name}
          {cards && cards.yellow > 0 && <span className="mini-tag yellow">🟨{cards.yellow > 1 ? cards.yellow : ""}</span>}
          {cards && cards.red > 0 && <span className="mini-tag red">🟥</span>}
        </div>
        {showTime && (
          <div className={"row-time" + (status === "amber" ? " tag-amber" : status === "coral" ? " tag-coral" : "")}>
            {formatTime(player.seconds)}
          </div>
        )}
        {extraRight}
      </div>
    );
  }

  function CardRow({ player, onAdd, onRemove }) {
    return (
      <div className="card-row">
        <div className="row-number">{player.number}</div>
        <div className="row-name">{player.name}</div>
        <div className="card-controls">
          <button className="card-btn yellow" onClick={() => onAdd("yellow")} aria-label="Añadir amarilla">🟨</button>
          <span className="card-count">{player.cards.yellow}</span>
          {player.cards.yellow > 0 && (
            <button className="card-undo" onClick={() => onRemove("yellow")} aria-label="Quitar amarilla">↺</button>
          )}
          <button className="card-btn red" onClick={() => onAdd("red")} aria-label="Añadir roja">🟥</button>
          <span className="card-count">{player.cards.red}</span>
          {player.cards.red > 0 && (
            <button className="card-undo" onClick={() => onRemove("red")} aria-label="Quitar roja">↺</button>
          )}
        </div>
      </div>
    );
  }

  function App() {
    const [loaded, setLoaded] = useState(false);
    const [activeTab, setActiveTab] = useState("jugadores");
    const [matchPhase, setMatchPhase] = useState("list");
    const [setupStep, setSetupStep] = useState("info");

    const [teamName, setTeamName] = useState("Mi equipo");
    const [halfDurationMin, setHalfDurationMin] = useState(35);
    const [players, setPlayers] = useState([]);
    const [nameInput, setNameInput] = useState("");
    const [numberInput, setNumberInput] = useState("");

    const [formationKey, setFormationKey] = useState("4-4-2");
    const [rivalName, setRivalName] = useState("");
    const [venue, setVenue] = useState("local");
    const [matchDate, setMatchDate] = useState(todayISO());
    const [matchHour, setMatchHour] = useState(nowHHMM());
    const [availablePlayerIds, setAvailablePlayerIds] = useState([]);

    const [lineup, setLineup] = useState({});
    const [selected, setSelected] = useState(null);
    const [playerSeconds, setPlayerSeconds] = useState({});
    const [matchSeconds, setMatchSeconds] = useState(0);
    const [running, setRunning] = useState(false);
    const [half, setHalf] = useState(1);
    const [cards, setCards] = useState({});
    const [cardsOpen, setCardsOpen] = useState(false);
    const [homeScore, setHomeScore] = useState(0);
    const [awayScore, setAwayScore] = useState(0);

    const [matchHistory, setMatchHistory] = useState([]);
    const [confirmClearHistory, setConfirmClearHistory] = useState(false);

    const formation = FORMATIONS[formationKey];

    useEffect(() => {
      (async () => {
        try {
          const res = await window.storage.get(ROSTER_KEY);
          if (res && res.value) {
            const data = JSON.parse(res.value);
            if (data.teamName) setTeamName(data.teamName);
            if (Array.isArray(data.players)) setPlayers(data.players);
            if (data.halfDurationMin) setHalfDurationMin(data.halfDurationMin);
          }
        } catch (e) {}
        try {
          const res2 = await window.storage.get(HISTORY_KEY);
          if (res2 && res2.value) {
            const hist = JSON.parse(res2.value);
            if (Array.isArray(hist)) setMatchHistory(hist);
          }
        } catch (e) {}
        setLoaded(true);
      })();
    }, []);

    useEffect(() => {
      if (!loaded) return;
      (async () => {
        try { await window.storage.set(ROSTER_KEY, JSON.stringify({ teamName, players, halfDurationMin })); } catch (e) {}
      })();
    }, [loaded, teamName, players, halfDurationMin]);

    useEffect(() => {
      if (!loaded) return;
      (async () => {
        try { await window.storage.set(HISTORY_KEY, JSON.stringify(matchHistory)); } catch (e) {}
      })();
    }, [loaded, matchHistory]);

    useEffect(() => {
      let wakeLock = null;
      (async () => {
        if (running && "wakeLock" in navigator) {
          try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
        }
      })();
      return () => { if (wakeLock) wakeLock.release().catch(() => {}); };
    }, [running]);

    useEffect(() => {
      if (!running) return;
      const interval = setInterval(() => {
        setMatchSeconds((s) => s + 1);
        setPlayerSeconds((prev) => {
          const next = { ...prev };
          Object.values(lineup).forEach((pid) => {
            if (pid) next[pid] = (next[pid] || 0) + 1;
          });
          return next;
        });
      }, 1000);
      return () => clearInterval(interval);
    }, [running, lineup]);

    const totalPlayerSeconds = (pid) => playerSeconds[pid] || 0;
    const cardsOf = (pid) => cards[pid] || { yellow: 0, red: 0 };

    const enrichedPlayers = players.map((p) => ({ ...p, seconds: totalPlayerSeconds(p.id), cards: cardsOf(p.id) }));
    const assignedIds = new Set(Object.values(lineup).filter(Boolean));
    const benchPlayers = enrichedPlayers.filter((p) => availablePlayerIds.includes(p.id) && !assignedIds.has(p.id));
    const targetShare = availablePlayerIds.length > 0 ? (matchSeconds * 11) / availablePlayerIds.length : 0;

    function statusFor(pid) {
      if (matchPhase !== "live") return null;
      const secs = totalPlayerSeconds(pid);
      const diff = secs - targetShare;
      const onField = assignedIds.has(pid);
      if (onField && diff > 90) return "coral";
      if (!onField && diff < -60) return "amber";
      return null;
    }

    function assign(slotId, playerId) {
      setLineup((prev) => {
        const next = { ...prev };
        Object.keys(next).forEach((k) => { if (next[k] === playerId) delete next[k]; });
        next[slotId] = playerId;
        return next;
      });
      setSelected(null);
    }

    function handleSlotTap(slotId) {
      if (selected && selected.type === "player") { assign(slotId, selected.id); return; }
      if (selected && selected.type === "slot" && selected.id === slotId) { setSelected(null); return; }
      setSelected({ type: "slot", id: slotId });
    }

    function handlePlayerTap(playerId) {
      if (selected && selected.type === "slot") { assign(selected.id, playerId); return; }
      if (selected && selected.type === "player" && selected.id === playerId) { setSelected(null); return; }
      setSelected({ type: "player", id: playerId });
    }

    function addPlayer() {
      const name = nameInput.trim();
      if (!name) return;
      const number = numberInput.trim() || String(players.length + 1);
      setPlayers((prev) => [...prev, { id: uid(), name, number }]);
      setNameInput("");
      setNumberInput("");
    }

    function removePlayer(id) {
      setPlayers((prev) => prev.filter((p) => p.id !== id));
      setLineup((prev) => {
        const next = { ...prev };
        Object.keys(next).forEach((k) => { if (next[k] === id) delete next[k]; });
        return next;
      });
      setAvailablePlayerIds((prev) => prev.filter((x) => x !== id));
    }

    function toggleAvailable(id) {
      const isAvail = availablePlayerIds.includes(id);
      if (isAvail) {
        setAvailablePlayerIds(availablePlayerIds.filter((x) => x !== id));
        setLineup((prev) => {
          const next = { ...prev };
          Object.keys(next).forEach((k) => { if (next[k] === id) delete next[k]; });
          return next;
        });
      } else {
        setAvailablePlayerIds([...availablePlayerIds, id]);
      }
    }

    function addCard(playerId, type) {
      setCards((prev) => {
        const cur = prev[playerId] || { yellow: 0, red: 0 };
        return { ...prev, [playerId]: { ...cur, [type]: cur[type] + 1 } };
      });
    }
    function removeCard(playerId, type) {
      setCards((prev) => {
        const cur = prev[playerId] || { yellow: 0, red: 0 };
        return { ...prev, [playerId]: { ...cur, [type]: Math.max(0, cur[type] - 1) } };
      });
    }

    function goToNewMatchSetup() {
      setRivalName("");
      setVenue("local");
      setMatchDate(todayISO());
      setMatchHour(nowHHMM());
      setAvailablePlayerIds(players.map((p) => p.id));
      setLineup({});
      setSelected(null);
      setPlayerSeconds({});
      setMatchSeconds(0);

                    <button className="btn btn-secondary btn-block" style={{ marginTop: 8 }} onClick={addPlayer}>+ Añadir jugador</button>

                    <div className="list">
                      {enrichedPlayers.length === 0 && <div className="empty-note">Todavía no has añadido jugadores.</div>}
                      {enrichedPlayers.map((p) => (
                        <PlayerRow key={p.id} player={p} onTap={() => {}} showTime={false}
                          extraRight={<button className="row-remove" onClick={() => removePlayer(p.id)} aria-label="Eliminar">×</button>} />
                      ))}
                    </div>
                    {!canGoLineup && <div className="warning-text">Añade al menos 11 jugadores para poder crear un partido ({players.length}/11).</div>}
                  </div>
                </div>
              )}

              {activeTab === "partidos" && matchPhase === "list" && (
                <div className="content">
                  <button className="btn btn-primary btn-block" disabled={!canGoLineup} onClick={goToNewMatchSetup}>+ Nuevo partido</button>
                  {!canGoLineup && <div className="warning-text">Añade al menos 11 jugadores en la pestaña Jugadores.</div>}
                  <div className="card">
                    <h2>Partidos guardados ({matchHistory.length})</h2>
                    {matchHistory.length === 0 && <div className="empty-note">Todavía no se ha jugado ningún partido.</div>}
                    {matchHistory.map((rec) => (
                      <div className="history-card" key={rec.id}>
                        <div className="history-info">
                          <div className="history-rival">vs {rec.rival}</div>
                          <div className="history-meta">{formatDateDisplay(rec.date)} · {rec.hour} · {rec.venue === "local" ? "Local" : "Visitante"}</div>
                        </div>
                        <div className="history-score">{rec.home}–{rec.away}</div>
                        <button className="row-remove" onClick={() => removeHistoryRecord(rec.id)} aria-label="Eliminar partido">×</button>
                      </div>
                    ))}
                    {matchHistory.length > 0 && !confirmClearHistory && (
                      <button className="btn btn-ghost btn-block" style={{ marginTop: 12 }} onClick={() => setConfirmClearHistory(true)}>Vaciar historial</button>
                    )}
                    {confirmClearHistory && (
                      <div className="confirm-box" style={{ marginTop: 12 }}>
                        Esto borra todos los partidos guardados. ¿Continuar?
                        <div className="actions-row">
                          <button className="btn btn-ghost" onClick={() => setConfirmClearHistory(false)}>Cancelar</button>
                          <button className="btn btn-danger" onClick={clearHistory}>Sí, vaciar</button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {activeTab === "partidos" && matchPhase === "setup" && setupStep === "info" && (
                <div className="content">
                  <div className="card">
                    <h2>Nuevo partido</h2>
                    <label className="field-label">Rival</label>
                    <input className="input" value={rivalName} onChange={(e) => setRivalName(e.target.value)} placeholder="Nombre del equipo rival" />
                    <label className="field-label" style={{ marginTop: 12 }}>Sede</label>
                    <div className="formation-grid">
                      <div className={"formation-chip" + (venue === "local" ? " active" : "")} onClick={() => setVenue("local")}>Local</div>
                      <div className={"formation-chip" + (venue === "visitante" ? " active" : "")} onClick={() => setVenue("visitante")}>Visitante</div>
                    </div>
                    <label className="field-label" style={{ marginTop: 12 }}>Fecha y hora</label>
                    <div className="row-inputs">
                      <input className="input" type="date" value={matchDate} onChange={(e) => setMatchDate(e.target.value)} />
                      <input className="input" type="time" value={matchHour} onChange={(e) => setMatchHour(e.target.value)} />
                    </div>
                    <label className="field-label" style={{ marginTop: 12 }}>Formación</label>
                    <div className="formation-grid">
                      {Object.keys(FORMATIONS).map((key) => (
                        <div key={key} className={"formation-chip" + (key === formationKey ? " active" : "")}
                          onClick={() => { setFormationKey(key); setLineup({}); }}>
                          {FORMATIONS[key].label}
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="card">
                    <h2>Jugadores disponibles ({availablePlayerIds.length}/{players.length})</h2>
                    <p className="card-hint">Marca quién puede jugar hoy.</p>
                    <div className="list">
                      {players.map((p) => (
                        <div key={p.id} className={"list-row" + (availablePlayerIds.includes(p.id) ? " list-row-selected" : "")}
                          onClick={() => toggleAvailable(p.id)}>
                          <div className="row-number">{p.number}</div>
                          <div className="row-name">{p.name}</div>
                          <div className="checkbox">{availablePlayerIds.includes(p.id) ? "✓" : ""}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="actions-row">
                    <button className="btn btn-ghost" onClick={() => setMatchPhase("list")}>Cancelar</button>
                    <button className="btn btn-primary" disabled={!canContinueToLineup} onClick={() => setSetupStep("lineup")}>Elegir alineación</button>
                  </div>
                  {!canContinueToLineup && <div className="warning-text">Escribe el rival y marca al menos 11 jugadores disponibles.</div>}
                </div>
              )}

              {activeTab === "partidos" && matchPhase === "setup" && setupStep === "lineup" && (
                <div className="content">
                  <div className="selection-hint">
                    Toca una posición del campo y luego un jugador de la lista para colocarlo. <b>{filledSlots}/{formation.slots.length}</b> posiciones cubiertas.
                  </div>
                  <div className="pitch-wrap">
                    <Pitch formation={formation} lineup={lineup} players={enrichedPlayers} selected={selected} onSlotTap={handleSlotTap} statusFor={statusFor} cardsFor={cardsOf} />
                  </div>

                  <div className="card">
                    <h2>Sin asignar ({benchPlayers.length})</h2>
                    <div className="list">
                      {benchPlayers.length === 0 && <div className="empty-note">Todos los disponibles están en el campo.</div>}
                      {benchPlayers.slice().sort((a, b) => Number(a.number) - Number(b.number)).map((p) => (
                        <PlayerRow key={p.id} player={p} onTap={() => handlePlayerTap(p.id)}
                          selected={selected && selected.type === "player" && selected.id === p.id} showTime={false} />
                      ))}
                    </div>
                  </div>

                  <div className="actions-row">
                    <button className="btn btn-ghost" onClick={() => setSetupStep("info")}>Volver</button>
                    <button className="btn btn-primary" disabled={!canStartMatch} onClick={startMatch}>Comenzar partido</button>
                  </div>
                  {!canStartMatch && <div className="warning-text">Faltan {formation.slots.length - filledSlots} posiciones por cubrir.</div>}
                </div>
              )}

              {activeTab === "partidos" && matchPhase === "summary" && (
                <div className="content">
                  <div className="card">
                    <h2>Resumen del partido</h2>
                    <div className="score-result">{teamName || "Nosotros"} {homeScore} – {awayScore} {rivalName || "Rival"}</div>
                    <p className="card-hint">{formatDateDisplay(matchDate)} · {matchHour} · {venue === "local" ? "Local" : "Visitante"} · Duración: {formatTime(matchSeconds)}</p>
                    <table className="summary-table">
                      <thead>
                        <tr><th>#</th><th>Jugador</th><th>Tiempo</th><th>%</th><th>🟨</th><th>🟥</th></tr>
                      </thead>
                      <tbody>
                        {enrichedPlayers
                          .filter((p) => availablePlayerIds.includes(p.id))
                          .slice().sort((a, b) => b.seconds - a.seconds)
                          .map((p) => (
                            <tr key={p.id}>
                              <td className="t-num">{p.number}</td>
                              <td>{p.name}</td>
                              <td className="t-num">{formatTime(p.seconds)}</td>
                              <td>{matchSeconds > 0 ? Math.round((p.seconds / matchSeconds) * 100) : 0}%</td>
                              <td className="t-num">{p.cards.yellow || ""}</td>
                              <td className="t-num">{p.cards.red || ""}</td>
                            </tr>
                          ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="actions-row">
                    <button className="btn btn-ghost" onClick={() => setMatchPhase("list")}>Ver partidos</button>
                    <button className="btn btn-primary" onClick={goToNewMatchSetup}>Nuevo partido</button>
                  </div>
                </div>
              )}

              {activeTab === "estadisticas" && (
                <div className="content">
                  <div className="stat-summary">
                    <div className="stat-box"><div className="num">{matchHistory.length}</div><div className="lbl">Partidos</div></div>
                    <div className="stat-box"><div className="num">{goalsFor}</div><div className="lbl">Goles a favor</div></div>
                    <div className="stat-box"><div className="num">{goalsAgainst}</div><div className="lbl">Goles en contra</div></div>
                  </div>
                  <div className="card">
                    <h2>Minutos y tarjetas por jugador</h2>
                    <p className="card-hint">Acumulado de todos los partidos finalizados.</p>
                    {aggList.length === 0 && <div className="empty-note">Todavía no hay partidos finalizados.</div>}
                    {aggList.length > 0 && (
                      <table className="summary-table">
                        <thead>
                          <tr><th>#</th><th>Jugador</th><th>PJ</th><th>Total</th><th>Media</th><th>🟨</th><th>🟥</th></tr>
                        </thead>
                        <tbody>
                          {aggList.slice().sort((a, b) => b.seconds - a.seconds).map((p) => (
                            <tr key={p.id}>
                              <td className="t-num">{p.number}</td>
                              <td>{p.name}</td>
                              <td className="t-num">{p.matches}</td>
                              <td className="t-num">{formatTime(p.seconds)}</td>
                              <td className="t-num">{formatTime(p.seconds / p.matches)}</td>
                              <td className="t-num">{p.yellow || ""}</td>
                              <td className="t-num">{p.red || ""}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                </div>
              )}
            </>
          )}
        </div>

        {matchPhase === "live" && activeTab !== "partidos" && (
          <div className="live-banner" onClick={() => setActiveTab("partidos")}>
            ● {rivalName ? `vs ${rivalName}` : "Partido"} en curso · {formatTime(matchSeconds)} · toca para volver
          </div>
        )}

        <div className="tabbar">
          {tabs.map((t) => {
            const Icon = t.icon;
            return (
              <button key={t.id} className={"tab-btn" + (activeTab === t.id ? " tab-active" : "")} onClick={() => setActiveTab(t.id)}>
                {matchPhase === "live" && t.id === "partidos" && activeTab !== "partidos" && <span className="tab-live-dot" />}
                <Icon active={activeTab === t.id} />
                <span>{t.label}</span>
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
