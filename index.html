    function svgToPngDataURL(svg, size) {
      return new Promise((resolve) => {
        const blob = new Blob([svg], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          const c = document.createElement("canvas"); c.width = size; c.height = size;
          const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, size, size);
          URL.revokeObjectURL(url); resolve(c.toDataURL("image/png"));
        };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(""); };
        img.src = url;
      });
    }
    (async () => {
      const png180 = await svgToPngDataURL(ICON_SVG, 180);
      const png192 = await svgToPngDataURL(ICON_SVG, 192);

        const swBlob = new Blob([swCode], { type: "application/javascript" });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      }

  function IconStats({ active }) { const c = active ? "var(--accent)" : "var(--ink-soft)"; return (<svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="4" y="12" width="4" height="8" rx="1" fill={c} /><rect x="10" y="7" width="4" height="13" rx="1" fill={c} /><rect x="16" y="3.5" width="4" height="16.5" rx="1" fill={c} /></svg>); }

                  </div>
                  <div className="card">
                    <h2>Minutos, goles y tarjetas</h2>
                    <p className="card-hint">Acumulado de todos los partidos finalizados.</p>
                    {aggList.length === 0 && <div className="empty-note">Todavía no hay partidos finalizados.</div>}
                    {aggList.length > 0 && (
                      <table className="summary-table">
                        <thead><tr><th>#</th><th>Jugador</th><th>PJ</th><th>Total</th><th>⚽</th><th>🅰️</th><th>🟨</th><th>🟥</th></tr></thead>
                        <tbody>
                          {aggList.slice().sort((a, b) => b.seconds - a.seconds).map((p) => (
                            <tr key={p.id}><td className="t-num">{p.number}</td><td>{p.name}</td><td className="t-num">{p.matches}</td><td className="t-num">{formatTime(p.seconds)}</td><td className="t-num">{p.goals || ""}</td><td className="t-num">{p.assists || ""}</td><td className="t-num">{p.yellow || ""}</td><td className="t-num">{p.red || ""}</td></tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                </div>
              )}
            </>
          )}
        </div>
        {matchPhase === "live" && activeTab !== "partidos" && (
          <div className="live-banner" onClick={() => setActiveTab("partidos")}>● {rivalName ? `vs ${rivalName}` : "Partido"} en curso · {formatTime(matchSeconds)} · toca para volver</div>
        )}
        {absenceModal && (
          <div className="modal-backdrop" onClick={() => setAbsenceModal(null)}>
            <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
              <div className="modal-header"><h2 style={{ margin: 0 }}>Motivo de ausencia</h2><button className="modal-close" onClick={() => setAbsenceModal(null)}>×</button></div>
              <p className="card-hint">Selecciona el motivo. Se quitará de la lista de convocados.</p>
              <div className={"absence-option" + (!absences[absenceModal] ? " selected" : "")} onClick={() => { const n = { ...absences }; delete n[absenceModal]; setAbsences(n); setAvailablePlayerIds((prev) => prev.includes(absenceModal) ? prev : [...prev, absenceModal]); setAbsenceModal(null); }}>
                <span>✅</span> Convocado (sin ausencia)
              </div>
              {Object.entries(ABSENCE_LABELS).map(([key, label]) => (
                <div key={key} className={"absence-option" + (absences[absenceModal] === key ? " selected" : "")} onClick={() => { setAbsences((prev) => ({ ...prev, [absenceModal]: key })); setAvailablePlayerIds((prev) => prev.filter((x) => x !== absenceModal)); setLineup((prev) => { const n = { ...prev }; Object.keys(n).forEach((k) => { if (n[k] === absenceModal) delete n[k]; }); return n; }); setAbsenceModal(null); }}>
                  <span>{label.split(" ")[0]}</span> {label.replace(/^\S+\s/, "")}
                </div>
              ))}
            </div>
          </div>
        )}
        <div className="tabbar">
          {tabs.map((t) => {
            const Icon = t.icon;
            return (
              <button key={t.id} className={"tab-btn" + (activeTab === t.id ? " tab-active" : "")} onClick={() => setActiveTab(t.id)}>
                {matchPhase === "live" && t.id === "partidos" && activeTab !== "partidos" && <span className="tab-live-dot" />}
                <Icon active={activeTab === t.id} />
                <span>{t.label}</span>
              </button>
            );
          })}
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
