                    <p className="card-hint">Marca quién puede jugar. Usa ❗ para indicar motivo de ausencia.</p>
                    <div className="list">
                      {players.map((p) => { const isAvail = availablePlayerIds.includes(p.id); const abs = absences[p.id]; return (<div key={p.id} className={"list-row" + (isAvail && !abs ? " list-row-selected" : "") + (abs ? " list-row-absence" : "")}><div className="row-name" onClick={() => toggleAvailable(p.id)}>{p.name}{abs && <span className="mini-tag absence">{ABSENCE_LABELS[abs]}</span>}</div><button className={"absence-btn" + (abs ? " has-absence" : "")} onClick={(e) => { e.stopPropagation(); setAbsenceModal(p.id); }}>❗</button><div className="checkbox" onClick={() => toggleAvailable(p.id)}>{isAvail ? "✓" : ""}</div></div>); })}
                    </div>
                  </div>
                  <div className="actions-row">
                    <button className="btn btn-ghost" onClick={() => { setEditingUpcomingId(null); setMatchPhase("list"); }}>Cancelar</button>
                    <button className="btn btn-primary" disabled={!canContinueToLineup} onClick={() => setSetupStep("lineup")}>Alineación</button>
                  </div>
                  {!canContinueToLineup && <div className="warning-text">Escribe el rival y marca al menos {minPlayers} jugadores disponibles.</div>}
                </div>
              )}
              {activeTab === "partidos" && matchPhase === "setup" && setupStep === "lineup" && (
                <div className="content">
                  <div className="selection-hint">
                    {isCustom ? (<>Toca el campo para añadir ficha. Mantén pulsado ~0,3s sobre una ficha para arrastrarla. <b>{formation.slots.length}</b> fichas.</>) : (<>Mantén pulsado ~0,3s sobre una ficha para arrastrarla. Toca para asignar. <b>{filledSlots}/{formation.slots.length}</b> cubiertas.</>)}
                  </div>
                  <div className="pitch-wrap">
                    <Pitch formation={formation} slots={formation.slots} lineup={lineup} players={enrichedPlayers} selected={selected} onSlotTap={isCustom ? (id) => { if (!lineup[id]) { if (confirm("¿Eliminar esta ficha?")) { setCustomSlots((prev) => prev.filter((s) => s.id !== id)); } } else { handleSlotTap(id); } } : handleSlotTap} statusFor={statusFor} cardsFor={cardsOf} onPitchTap={addCustomSlot} onSlotDrag={handleSlotDrag} draggable={true} />
                  </div>
                  <div className="card">
                    <h2>Sin asignar ({benchPlayers.length})</h2>
                    <div className="list">
                      {benchPlayers.length === 0 && <div className="empty-note">Todos los disponibles están en el campo.</div>}
                      {benchPlayers.slice().sort((a, b) => Number(a.number) - Number(b.number)).map((p) => (<PlayerRow key={p.id} player={p} onTap={() => handlePlayerTap(p.id)} selected={selected && selected.type === "player" && selected.id === p.id} showTime={false} />))}
                    </div>
                  </div>
                  <div className="actions-row">
                    <button className="btn btn-ghost" onClick={() => setSetupStep("info")}>Volver</button>
                    <button className="btn btn-ghost" onClick={scheduleMatch}>{editingUpcomingId ? "Guardar cambios" : "Programar"}</button>
                    {!editingUpcomingId && <button className="btn btn-primary" disabled={!canStartMatch} onClick={startMatch}>Empezar</button>}
                  </div>
                  {!canStartMatch && !editingUpcomingId && <div className="warning-text">Faltan {formation.slots.length - filledSlots} posiciones por cubrir.</div>}
                </div>
              )}
              {activeTab === "partidos" && matchPhase === "summary" && (
                <div className="content">
                  <div className="card">
                    <h2>Resumen del partido</h2>
                    <div className="score-result">{teamName || "Nosotros"} {homeScore} – {awayScore} {rivalName || "Rival"}</div>
                    <p className="card-hint">{formatDateDisplay(matchDate)} · {matchHour} · {venue === "local" ? "Local" : "Visitante"} · Duración: {formatTime(matchSeconds)}</p>
                    {events.length > 0 && (<div style={{ marginBottom: 12 }}><h3 style={{ fontSize: 13, marginBottom: 6, color: "var(--ink-soft)" }}>Goles</h3>{events.map((ev) => (<div key={ev.id} style={{ fontSize: 13, padding: "6px 0", borderBottom: "1px solid var(--line)" }}>⚽ {formatTime(ev.time)} · <b>{ev.scorerName}</b>{ev.assistName ? <span> (asist. {ev.assistName})</span> : null}</div>))}</div>)}
                    {Object.keys(absences).length > 0 && (<div style={{ marginBottom: 12 }}><h3 style={{ fontSize: 13, marginBottom: 6, color: "var(--ink-soft)" }}>Ausencias</h3>{Object.entries(absences).map(([pid, reason]) => { const p = players.find((x) => x.id === pid); if (!p) return null; return (<div key={pid} style={{ fontSize: 13, padding: "4px 0" }}>{ABSENCE_LABELS[reason]} — {p.name}</div>); })}</div>)}
                    <table className="summary-table">
                      <thead><tr><th>Jugador</th><th>Min</th><th>%</th><th>🟨</th><th>🟥</th></tr></thead>
                      <tbody>
                        {enrichedPlayers.filter((p) => availablePlayerIds.includes(p.id)).slice().sort((a, b) => b.seconds - a.seconds).map((p) => (
                          <tr key={p.id}><td>{p.name}</td><td className="t-num">{formatTime(p.seconds)}</td><td>{matchSeconds > 0 ? Math.round((p.seconds / matchSeconds) * 100) : 0}%</td><td className="t-num">{p.cards.yellow || ""}</td><td className="t-num">{p.cards.red || ""}</td></tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <div className="actions-row">
                    <button className="btn btn-ghost" onClick={() => setMatchPhase("list")}>Ver partidos</button>
                    <button className="btn btn-primary" onClick={goToNewMatchSetup}>Nuevo partido</button>
                  </div>
                </div>
              )}
              {activeTab === "estadisticas" && (
                <div className="content">
                  <div className="format-header">⚽ Fútbol 11</div>
                  <div className="stat-summary">
                    <div className="stat-box"><div className="num">{f11History.length}</div><div className="lbl">Partidos</div></div>
                    <div className="stat-box"><div className="num">{f11History.reduce((a, r) => a + r.home, 0)}</div><div className="lbl">Goles a favor</div></div>
                    <div className="stat-box"><div className="num">{f11History.reduce((a, r) => a + r.away, 0)}</div><div className="lbl">Goles en contra</div></div>
                  </div>
                  <div className="card">
                    <h2>Por partido</h2>
                    {f11History.length === 0 && <div className="empty-note">Sin partidos.</div>}
                    {f11History.map((rec) => (
                      <div key={rec.id} style={{ marginTop: 12 }}>
                        <div style={{ fontSize: 13, fontWeight: 700 }}>{rec.teamName || "Nosotros"} {rec.home}–{rec.away} {rec.rival}</div>
                        <div style={{ fontSize: 11, color: "var(--ink-soft)", marginBottom: 4 }}>{formatDateDisplay(rec.date)} · {rec.hour}</div>
                        <table className="summary-table">
                          <thead><tr><th>Jugador</th><th>Min</th><th>⚽</th><th>🅰️</th><th>🟨</th><th>🟥</th></tr></thead>
                          <tbody>
                            {(rec.players || []).slice().sort((a, b) => b.seconds - a.seconds).map((p) => {
                              const goals = (rec.events || []).filter((e) => e.scorerId === p.id).length;
                              const assists = (rec.events || []).filter((e) => e.assistId === p.id).length;
                              return (<tr key={p.id}><td>{p.name}</td><td className="t-num">{formatTime(p.seconds)}</td><td className="t-num">{goals || ""}</td><td className="t-num">{assists || ""}</td><td className="t-num">{p.cards.yellow || ""}</td><td className="t-num">{p.cards.red || ""}</td></tr>);
                            })}
                          </tbody>
                        </table>
                      </div>
                    ))}
                  </div>
                  <div className="card">
                    <h2>Totales acumulados</h2>
                    {aggF11.length === 0 && <div className="empty-note">Sin datos.</div>}
                    {aggF11.length > 0 && (<table className="summary-table"><thead><tr><th>Jugador</th><th>PJ</th><th>Total</th><th>⚽</th><th>🅰️</th><th>🟨</th><th>🟥</th></tr></thead><tbody>{aggF11.slice().sort((a, b) => b.seconds - a.seconds).map((p) => (<tr key={p.id}><td>{p.name}</td><td className="t-num">{p.matches}</td><td className="t-num">{formatTime(p.seconds)}</td><td className="t-num">{p.goals || ""}</td><td className="t-num">{p.assists || ""}</td><td className="t-num">{p.yellow || ""}</td><td className="t-num">{p.red || ""}</td></tr>))}</tbody></table>)}
                  </div>

                  <div className="format-header">⚽ Fútbol 7</div>
                  <div className="stat-summary">
                    <div className="stat-box"><div className="num">{f7History.length}</div><div className="lbl">Partidos</div></div>
                    <div className="stat-box"><div className="num">{f7History.reduce((a, r) => a + r.home, 0)}</div><div className="lbl">Goles a favor</div></div>
                    <div className="stat-box"><div className="num">{f7History.reduce((a, r) => a + r.away, 0)}</div><div className="lbl">Goles en contra</div></div>
                  </div>
                  <div className="card">
                    <h2>Por partido</h2>
                    {f7History.length === 0 && <div className="empty-note">Sin partidos.</div>}
                    {f7History.map((rec) => (
                      <div key={rec.id} style={{ marginTop: 12 }}>
                        <div style={{ fontSize: 13, fontWeight: 700 }}>{rec.teamName || "Nosotros"} {rec.home}–{rec.away} {rec.rival}</div>
                        <div style={{ fontSize: 11, color: "var(--ink-soft)", marginBottom: 4 }}>{formatDateDisplay(rec.date)} · {rec.hour}</div>
                        <table className="summary-table">
                          <thead><tr><th>Jugador</th><th>Min</th><th>⚽</th><th>🅰️</th><th>🟨</th><th>🟥</th></tr></thead>
                          <tbody>
                            {(rec.players || []).slice().sort((a, b) => b.seconds - a.seconds).map((p) => {
                              const goals = (rec.events || []).filter((e) => e.scorerId === p.id).length;
                              const assists = (rec.events || []).filter((e) => e.assistId === p.id).length;
                              return (<tr key={p.id}><td>{p.name}</td><td className="t-num">{formatTime(p.seconds)}</td><td className="t-num">{goals || ""}</td><td className="t-num">{assists || ""}</td><td className="t-num">{p.cards.yellow || ""}</td><td className="t-num">{p.cards.red || ""}</td></tr>);
                            })}
                          </tbody>
                        </table>
                      </div>
                    ))}
                  </div>
                  <div className="card">
                    <h2>Totales acumulados</h2>
                    {aggF7.length === 0 && <div className="empty-note">Sin datos.</div>}
                    {aggF7.length > 0 && (<table className="summary-table"><thead><tr><th>Jugador</th><th>PJ</th><th>Total</th><th>⚽</th><th>🅰️</th><th>🟨</th><th>🟥</th></tr></thead><tbody>{aggF7.slice().sort((a, b) => b.seconds - a.seconds).map((p) => (<tr key={p.id}><td>{p.name}</td><td className="t-num">{p.matches}</td><td className="t-num">{formatTime(p.seconds)}</td><td className="t-num">{p.goals || ""}</td><td className="t-num">{p.assists || ""}</td><td className="t-num">{p.yellow || ""}</td><td className="t-num">{p.red || ""}</td></tr>))}</tbody></table>)}
                  </div>
                </div>
              )}
            </>
          )}
        </div>
        {matchPhase === "live" && activeTab !== "partidos" && (<div className="live-banner" onClick={() => { setActiveTab("partidos"); }}>● {rivalName ? `vs ${rivalName}` : "Partido"} en curso · {formatTime(matchSeconds)} · toca para volver</div>)}
        {absenceModal && (<div className="modal-backdrop" onClick={() => setAbsenceModal(null)}><div className="modal-sheet" onClick={(e) => e.stopPropagation()}><div className="modal-header"><h2 style={{ margin: 0 }}>Motivo de ausencia</h2><button className="modal-close" onClick={() => setAbsenceModal(null)}>×</button></div><p className="card-hint">Selecciona el motivo. Se quitará de la lista de convocados.</p><div className={"absence-option" + (!absences[absenceModal] ? " selected" : "")} onClick={() => { const n = { ...absences }; delete n[absenceModal]; setAbsences(n); setAvailablePlayerIds((prev) => prev.includes(absenceModal) ? prev : [...prev, absenceModal]); setAbsenceModal(null); }}><span>✅</span> Convocado (sin ausencia)</div>{Object.entries(ABSENCE_LABELS).map(([key, label]) => (<div key={key} className={"absence-option" + (absences[absenceModal] === key ? " selected" : "")} onClick={() => { setAbsences((prev) => ({ ...prev, [absenceModal]: key })); setAvailablePlayerIds((prev) => prev.filter((x) => x !== absenceModal)); setLineup((prev) => { const n = { ...prev }; Object.keys(n).forEach((k) => { if (n[k] === absenceModal) delete n[k]; }); return n; }); setAbsenceModal(null); }}><span>{label.split(" ")[0]}</span> {label.replace(/^\S+\s/, "")}</div>))}</div></div>)}
        {newTeamOpen && (<NewTeamModal onCreate={(name, fmt) => { createTeam(name, fmt); setNewTeamOpen(false); setTeamDetailOpen(true); }} onCancel={() => setNewTeamOpen(false)} />)}
        {addPlayerOpen && (<AddPlayerModal onAdd={addPlayer} onCancel={() => setAddPlayerOpen(false)} />)}
        {editingPlayer && (<AddPlayerModal existing={editingPlayer} onAdd={(data) => updatePlayer(editingPlayer.id, data)} onCancel={() => setEditPlayerId(null)} />)}
        {matchTeamSelectorOpen && (<MatchTeamSelector teams={teams} onSelect={onSelectMatchTeam} onCancel={() => setMatchTeamSelectorOpen(false)} />)}
        {detailRecord && (<MatchDetailModal record={detailRecord} onClose={() => setDetailRecord(null)} />)}
        <div className="tabbar">
          {tabs.map((t) => {
            const Icon = t.icon;
            return (<button key={t.id} className={"tab-btn" + (activeTab === t.id ? " tab-active" : "")} onClick={() => { setActiveTab(t.id); if (t.id === "jugadores") setTeamDetailOpen(false); }}>{matchPhase === "live" && t.id === "partidos" && activeTab !== "partidos" && <span className="tab-live-dot" />}<Icon active={activeTab === t.id} /><span>{t.label}</span></button>);
          })}
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
